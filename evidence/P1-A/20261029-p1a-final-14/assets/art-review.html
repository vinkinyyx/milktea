<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P1-A Art Review 20261029-p1a-final-14</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1e8da;color:#382a22;font:14px/1.45 system-ui,"Microsoft YaHei",sans-serif}header{position:sticky;top:0;background:#fffaf1;border-bottom:1px solid #bda68d;padding:12px 18px;z-index:3;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0}select,button{font:inherit;padding:8px 12px;border:1px solid #9b7658;border-radius:8px;background:#fff7e9;color:#382a22}button[aria-pressed=true]{background:#775037;color:white}#summary{margin-left:auto;font-size:12px}main{padding:18px;max-width:1400px;margin:auto}.checker{background-color:#fff;background-image:linear-gradient(45deg,#dfd7cc 25%,transparent 25%),linear-gradient(-45deg,#dfd7cc 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#dfd7cc 75%),linear-gradient(-45deg,transparent 75%,#dfd7cc 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.cardGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.card{padding:9px;border:1px solid #bda68d;border-radius:10px;background:#fff9ee;cursor:pointer}.card img{width:100%;height:130px;object-fit:contain}.card .name{font-size:12px;overflow-wrap:anywhere}.card .meta{font-size:11px;color:#665445}.detail{display:grid;grid-template-columns:minmax(420px,2fr) minmax(250px,1fr);gap:18px}.pane{background:#fff9ee;border:1px solid #bda68d;border-radius:12px;padding:12px}.detail canvas{max-width:100%;height:auto;display:block;margin:auto;border:1px solid #c8b8a4}.samples{display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:10px;margin-top:14px}.sample canvas{width:100%;height:auto}.muted{color:#695a4c;font-size:12px}.result{font-weight:700}.result.pass{color:#267544}.result.fail{color:#a33324}@media(max-width:760px){.detail{grid-template-columns:1fr}.samples{grid-template-columns:1fr}.detail canvas{width:100%}}
</style></head><body>
<header><h1>P1-A素材检查 · 20261029-p1a-final-14</h1><select id="asset"></select><button data-mode="overview">81项总览</button><button data-mode="anchor">透明边与原锚点</button><button data-mode="nine">九切</button><button data-mode="cup">杯层</button><span id="summary"></span></header>
<main><div id="view"></div></main>
<script>
const BUILD_ID='20261029-p1a-final-14';let data,mode='overview',selected;const $=s=>document.querySelector(s);const view=$('#view');
function checker(ctx,w,h){ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.fillStyle='#ddd5ca';for(let y=0;y<h;y+=24)for(let x=0;x<w;x+=24)if((x/24+y/24)%2===0)ctx.fillRect(x,y,24,24)}
function image(row){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=row.compiledNativePath;})}
function setMode(next){mode=next;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));render()}
function selectAsset(id){selected=data.variants.find(v=>v.assetId===id);$('#asset').value=id;setMode('anchor')}
function card(row){const d=document.createElement('article');d.className='card';const im=document.createElement('img');im.className='checker';im.src=row.compiledNativePath;im.alt=row.assetId;d.append(im);d.insertAdjacentHTML('beforeend',`<div class="name">${row.assetId}</div><div class="meta">${row.pixels.join('×')} · pivot ${row.pivot.join(',')} · ${row.nineSliceInsets?'九切':''}</div>`);d.onclick=()=>selectAsset(row.assetId);return d}
async function drawAnchor(row){const im=await image(row),canvas=$('#detail'),ctx=canvas.getContext('2d');canvas.width=720;canvas.height=560;checker(ctx,canvas.width,canvas.height);const scale=Math.min(620/row.pixels[0],440/row.pixels[1]);const w=row.pixels[0]*scale,h=row.pixels[1]*scale;const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));const px=clamp(360,row.pivot[0]*w+20,700-(1-row.pivot[0])*w);const py=clamp(280,(1-row.pivot[1])*h+20,540-row.pivot[1]*h);const x=px-row.pivot[0]*w,y=py-(1-row.pivot[1])*h;ctx.drawImage(im,x,y,w,h);ctx.strokeStyle='#d52f20';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px-28,py);ctx.lineTo(px+28,py);ctx.moveTo(px,py-28);ctx.lineTo(px,py+28);ctx.stroke();ctx.strokeStyle='#227d4a';ctx.lineWidth=1;ctx.strokeRect(x,y,w,h);const off=document.createElement('canvas');off.width=im.width;off.height=im.height;const oc=off.getContext('2d',{willReadFrequently:true});oc.drawImage(im,0,0);const pixels=oc.getImageData(0,0,off.width,off.height).data;let l=off.width,t=off.height,r=0,b=0;for(let yy=0;yy<off.height;yy++)for(let xx=0;xx<off.width;xx++)if(pixels[(yy*off.width+xx)*4+3]>8){l=Math.min(l,xx);t=Math.min(t,yy);r=Math.max(r,xx);b=Math.max(b,yy)}ctx.strokeStyle='#176fc1';ctx.setLineDash([5,4]);ctx.strokeRect(x+l*scale,y+t*scale,(r-l+1)*scale,(b-t+1)*scale);ctx.setLineDash([]);row._visualAlpha=[l,t,off.width-r-1,off.height-b-1];$('#alpha').textContent=`像素alpha非透明边距 L/T/R/B=${row._visualAlpha.join('/')}`}
function drawNine(ctx,im,ins,dw,dh){const [l,t,r,b]=ins,[sw,sh]=[im.width,im.height];if(dw<=l+r||dh<=t+b)throw Error('目标尺寸小于九切边距');const sx=[0,l,sw-r,sw],sy=[0,t,sh-b,sh],dx=[0,l,dw-r,dw],dy=[0,t,dh-b,dh];for(let yy=0;yy<3;yy++)for(let xx=0;xx<3;xx++)ctx.drawImage(im,sx[xx],sy[yy],sx[xx+1]-sx[xx],sy[yy+1]-sy[yy],dx[xx],dy[yy],dx[xx+1]-dx[xx],dy[yy+1]-dy[yy])}
async function render(){if(mode==='overview'){const grid=document.createElement('div');grid.className='cardGrid';data.variants.forEach(row=>grid.append(card(row)));view.replaceChildren(grid);return}if(mode==='cup'){await renderCup();return}if(!selected)selected=data.variants[0];if(mode==='anchor'){view.innerHTML=`<div class="detail"><section class="pane"><canvas id="detail" class="checker"></canvas></section><section class="pane"><h2>${selected.assetId}</h2><div>实际变体：${selected.variantId}</div><div>像素：${selected.pixels.join('×')}</div><div>原锚点：${selected.pivot.join(', ')}</div><div>九切(inset L/T/R/B)：${selected.nineSliceInsets?.join(', ')??'无'}</div><div>alpha留边(目录)：${selected.alphaInsets?.join(', ')??'未登记'}</div><div>资源哈希一致：<span class="result ${selected.hashMatches?'pass':'fail'}">${selected.hashMatches?'PASS':'FAIL'}</span></div><p id="alpha" class="muted"></p><p class="muted">绿框是完整纹理画布，红十字是原pivot，蓝虚线是alpha阈值&gt;8的非透明包围框。图片来自 final build 的 native 资源。</p><button id="prev">上一项</button><button id="next">下一项</button></section></div>`;$('#prev').onclick=()=>selectAsset(data.variants[(data.variants.indexOf(selected)+80)%81].assetId);$('#next').onclick=()=>selectAsset(data.variants[(data.variants.indexOf(selected)+1)%81].assetId);await drawAnchor(selected);return}
if(mode==='nine'){const rows=data.variants.filter(row=>row.nineSliceInsets);if(!selected.nineSliceInsets)selected=rows[0];const im=await image(selected);view.innerHTML=`<section class="pane"><h2>${selected.assetId} · ${selected.variantId}</h2><p>源 ${im.width}×${im.height}px · inset L/T/R/B=${selected.nineSliceInsets?.join(', ')??'无'} · SpriteFrame uses SLICED when inset exists.</p><div class="samples" id="samples"></div><p class="muted">三组画布由 final package native image 与该实际variant inset绘制九区域；边界值、目标尺寸与本页数据保留用于复核。</p></section>`;const specs=[[Math.max(128,selected.nineSliceInsets[0]+selected.nineSliceInsets[2]+24),Math.max(96,selected.nineSliceInsets[1]+selected.nineSliceInsets[3]+24),'最小合法'],[256,160,'常规'],[420,240,'较宽']];for(const [w,h,label] of specs){const card=document.createElement('div');card.className='sample pane';card.innerHTML=`<b>${label} ${w}×${h} DU</b>`;const c=document.createElement('canvas');c.width=w;c.height=h;c.className='checker';drawNine(c.getContext('2d'),im,selected.nineSliceInsets,w,h);card.append(c);$('#samples').append(card)}return}
}
async function renderCup(){const rows=data.cupLayerOrder;view.innerHTML=`<section class="pane"><h2>杯层原锚点合成 · 750×1000共同画布 · world origin (0, 200)</h2><p>${rows.map(r=>r.assetId).join(' → ')}</p><label>显示倍率 <select id="cupScale"><option value="1">scale 1.0</option><option value="0.8">scale 0.8</option></select></label><canvas id="cup" class="checker" width="750" height="1000" style="width:min(100%,500px)"></canvas><p class="muted">所有层以原anchor 0,0对齐；背景棋盘显示透明边。红线为画布原点，不修改物理状态。</p></section>`;const c=$('#cup'),ctx=c.getContext('2d');async function draw(){const s=Number($('#cupScale').value);checker(ctx,c.width,c.height);ctx.save();ctx.translate(375,800);ctx.scale(s,s);ctx.translate(-375,-800);for(const row of rows){const im=await image(row);ctx.drawImage(im,0,0)}ctx.restore();ctx.strokeStyle='#b52222';ctx.beginPath();ctx.moveTo(360,800);ctx.lineTo(390,800);ctx.moveTo(375,785);ctx.lineTo(375,815);ctx.stroke()}$('#cupScale').onchange=draw;await draw()}
window.__p1aArtReviewInspectAll=async()=>{const out=[];for(const row of data.variants){const im=await image(row),off=document.createElement('canvas');off.width=im.width;off.height=im.height;const ctx=off.getContext('2d',{willReadFrequently:true});ctx.drawImage(im,0,0);const p=ctx.getImageData(0,0,off.width,off.height).data;let l=off.width,t=off.height,r=-1,b=-1,transparent=0;for(let y=0;y<off.height;y++)for(let x=0;x<off.width;x++){const a=p[(y*off.width+x)*4+3];if(a>8){l=Math.min(l,x);t=Math.min(t,y);r=Math.max(r,x);b=Math.max(b,y)}else transparent++}out.push({assetId:row.assetId,variantId:row.variantId,pixels:row.pixels,pivot:row.pivot,alphaInsets:[l,t,off.width-r-1,off.height-b-1],transparentPixels:transparent,nonEmpty:r>=0,hashMatches:row.hashMatches,nineSliceInsets:row.nineSliceInsets})}return out};
async function boot(){data=await(await fetch('/data.json')).json();window.__p1aArtReview=data;if(data.buildId!==BUILD_ID)throw Error('build identity mismatch');$('#summary').textContent=`${data.count}已编译变体；SHA-256全匹配`;for(const row of data.variants){const o=document.createElement('option');o.value=row.assetId;o.textContent=row.assetId;$('#asset').append(o)}selected=data.variants[0];$('#asset').onchange=()=>{selected=data.variants.find(v=>v.assetId===$('#asset').value);if(mode==='overview')setMode('anchor');else render()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));setMode('overview')};boot().catch(e=>{view.textContent=`review error: ${e}`});
</script></body></html>
