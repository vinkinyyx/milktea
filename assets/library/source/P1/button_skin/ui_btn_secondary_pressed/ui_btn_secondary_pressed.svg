<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="512" height="192" viewBox="0 0 512 192">
<title>奶茶挤挤 secondary pressed button skin</title>
<desc>Button skin only. No text or icon. Straight alpha PNG export. sRGB intended.</desc>
<defs>
 <linearGradient id="secondary_pressed_body" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0%" stop-color="#E5D4C0" />
   <stop offset="53%" stop-color="#CFB99F" />
   <stop offset="100%" stop-color="#BDA186" />
 </linearGradient>
 <linearGradient id="secondary_pressed_sheen" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#FFF1DC" stop-opacity=".38" />
  <stop offset="48%" stop-color="#FFF1DC" stop-opacity=".08" />
  <stop offset="100%" stop-color="#FFF1DC" stop-opacity="0" />
 </linearGradient>
 </defs>
<g id="base_shape"><rect x="8" y="10" width="496" height="172" rx="55" ry="55" fill="url(#secondary_pressed_body)" stroke="#79614F" stroke-width="7" /></g>
<g id="surface_sheen" opacity=".23">
      <rect x="8" y="10" width="496" height="172" rx="55" ry="55" fill="url(#secondary_pressed_sheen)" stroke="none" />
    </g>
<g id="pressed_inset">
           <rect x="14" y="16" width="484" height="160" rx="50" fill="none" stroke="#79614F" stroke-opacity=".8" stroke-width="8" />
           <path d="M 65 35 H 447" fill="none" stroke="#F0DDC7" stroke-opacity=".27" stroke-width="5" stroke-linecap="round" />
           <path d="M 65 161 H 447" fill="none" stroke="#F0DDC7" stroke-opacity=".27" stroke-width="3" stroke-linecap="round" />
        </g>

</svg>