<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="192" height="192" viewBox="0 0 192 192">
<title>奶茶挤挤 icon pressed button skin</title>
<desc>Button skin only. No text or icon. Straight alpha PNG export. sRGB intended.</desc>
<defs>
 <linearGradient id="icon_pressed_body" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0%" stop-color="#E5D4C0" />
   <stop offset="53%" stop-color="#CFB99F" />
   <stop offset="100%" stop-color="#BDA186" />
 </linearGradient>
 <linearGradient id="icon_pressed_sheen" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#FFF1DC" stop-opacity=".38" />
  <stop offset="48%" stop-color="#FFF1DC" stop-opacity=".08" />
  <stop offset="100%" stop-color="#FFF1DC" stop-opacity="0" />
 </linearGradient>
 </defs>
<g id="base_shape"><circle cx="96" cy="96" r="84" fill="url(#icon_pressed_body)" stroke="#79614F" stroke-width="7" /></g>
<g id="surface_sheen" opacity=".23">
      <circle cx="96" cy="96" r="84" fill="url(#icon_pressed_sheen)" stroke="none" />
    </g>
<g id="pressed_inset">
           <circle cx="96" cy="96" r="77" fill="none" stroke="#79614F" stroke-opacity=".8" stroke-width="8" />
           <path d="M 39 73 C 43 37, 71 24, 96 24 C 122 24, 148 42, 152 72" fill="none" stroke="#F0DDC7" stroke-opacity=".27" stroke-width="4" stroke-linecap="round" />
           <path d="M 35 124 Q 96 185 157 124" fill="none" stroke="#F0DDC7" stroke-opacity=".27" stroke-width="3" stroke-linecap="round" />
        </g>

</svg>