<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="192" height="192" viewBox="0 0 192 192">
<title>奶茶挤挤 icon disabled button skin</title>
<desc>Button skin only. No text or icon. Straight alpha PNG export. sRGB intended.</desc>
<defs>
 <linearGradient id="icon_disabled_body" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0%" stop-color="#E0DBD4" />
   <stop offset="53%" stop-color="#CDC6BE" />
   <stop offset="100%" stop-color="#B9B2AB" />
 </linearGradient>
 <linearGradient id="icon_disabled_sheen" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#F6F1EA" stop-opacity=".38" />
  <stop offset="48%" stop-color="#F6F1EA" stop-opacity=".08" />
  <stop offset="100%" stop-color="#F6F1EA" stop-opacity="0" />
 </linearGradient>
 </defs>
<g id="base_shape"><circle cx="96" cy="96" r="84" fill="url(#icon_disabled_body)" stroke="#857C74" stroke-width="7" /></g>
<g id="surface_sheen" opacity=".75">
      <circle cx="96" cy="96" r="84" fill="url(#icon_disabled_sheen)" stroke="none" />
    </g>
<g id="disabled_outlines">
            <circle cx="96" cy="96" r="77" fill="none" stroke="#B7ABA0" stroke-opacity=".62" stroke-width="4" />
            <path d="M 39 73 C 43 37, 71 24, 96 24 C 122 24, 148 42, 152 72" fill="none" stroke="#E9E4DE" stroke-opacity=".38" stroke-width="4" stroke-linecap="round" />
        </g>

</svg>