<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="512" height="192" viewBox="0 0 512 192">
<title>奶茶挤挤 secondary selected button skin</title>
<desc>Button skin only. No text or icon. Straight alpha PNG export. sRGB intended.</desc>
<defs>
 <linearGradient id="secondary_selected_body" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0%" stop-color="#FFF8EB" />
   <stop offset="53%" stop-color="#F5E2C1" />
   <stop offset="100%" stop-color="#E5CA9E" />
 </linearGradient>
 <linearGradient id="secondary_selected_sheen" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".38" />
  <stop offset="48%" stop-color="#FFFFFF" stop-opacity=".08" />
  <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
 </linearGradient>
 </defs>
<g id="base_shape"><rect x="8" y="10" width="496" height="172" rx="55" ry="55" fill="url(#secondary_selected_body)" stroke="#7B4A32" stroke-width="7" /></g>
<g id="surface_sheen" opacity=".75">
      <rect x="8" y="10" width="496" height="172" rx="55" ry="55" fill="url(#secondary_selected_sheen)" stroke="none" />
    </g>
<g id="bevel_highlights">
         <rect x="14" y="16" width="484" height="160" rx="50" fill="none" stroke="#C68B48" stroke-width="3.5" stroke-opacity=".75" />
         <path d="M 65 35 H 447" fill="none" stroke="#FFF8E8" stroke-width="5" stroke-opacity=".86" stroke-linecap="round" />
         <path d="M 65 161 H 447" fill="none" stroke="#7B4A32" stroke-opacity=".37" stroke-width="3.5" stroke-linecap="round" />
        </g>
<g id="selection_double_border">
           <rect x="18" y="20" width="476" height="152" rx="46" fill="none" stroke="#8B4E2F" stroke-width="5.5" />
           <rect x="22" y="24" width="468" height="144" rx="43" fill="none" stroke="#C2894A" stroke-width="2.5" />
        </g>
</svg>