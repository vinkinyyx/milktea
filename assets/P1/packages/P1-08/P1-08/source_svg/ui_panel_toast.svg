<svg xmlns="http://www.w3.org/2000/svg" width="500" height="80" viewBox="0 0 250 40" version="1.1" role="img">
<title>短提示底 / ui_panel_toast</title><desc>独立可编辑矢量母版，2x逻辑源尺寸 500x80; 运行PNG 250x40; 九切 16,16,16,16 像素。所有运行时标题、分数、头像、数字由程序绘制。色彩空间 sRGB。</desc>
<defs>
<linearGradient id="toast_paper" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
<stop offset="0%" stop-color="#FFF7E9"/><stop offset="49%" stop-color="#EFDCC2"/><stop offset="100%" stop-color="#E0C5A7"/></linearGradient>
<linearGradient id="toast_shine" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#FFF" stop-opacity=".54"/><stop offset="18%" stop-color="#FFF" stop-opacity=".13"/><stop offset="65%" stop-color="#FFF" stop-opacity="0"/><stop offset="100%" stop-color="#623B21" stop-opacity=".045"/></linearGradient>
</defs>
<g id="layer_01_soft_contact_shadow"><rect x="3" y="5" width="244" height="32" rx="13" fill="#593721" opacity=".11"/></g>
<g id="layer_02_paper_base"><rect x="3" y="3" width="244" height="34" rx="13" fill="url(#toast_paper)" stroke="#805940" stroke-width="2.8"/></g>
<g id="layer_03_soft_surface_highlight"><rect x="5" y="5" width="240" height="30" rx="10" fill="url(#toast_shine)" opacity=".35"/></g>
<g id="layer_04_inside_bevel"><rect x="7" y="7" width="236" height="26" rx="9" fill="none" stroke="#FFFDF6" stroke-width="2" opacity=".84"/></g>
<g id="layer_05_fine_trim"></g>
<g id="layer_06_fixed_corner_accents"></g>
</svg>