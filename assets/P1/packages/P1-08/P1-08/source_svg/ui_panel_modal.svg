<svg xmlns="http://www.w3.org/2000/svg" width="640" height="720" viewBox="0 0 320 360" version="1.1" role="img">
<title>通用弹窗底 / ui_panel_modal</title><desc>独立可编辑矢量母版，2x逻辑源尺寸 640x720; 运行PNG 320x360; 九切 32,32,32,32 像素。所有运行时标题、分数、头像、数字由程序绘制。色彩空间 sRGB。</desc>
<defs>
<linearGradient id="modal_paper" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
<stop offset="0%" stop-color="#FFF9F0"/><stop offset="49%" stop-color="#F5E9D7"/><stop offset="100%" stop-color="#E6CDAF"/></linearGradient>
<linearGradient id="modal_shine" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#FFF" stop-opacity=".54"/><stop offset="18%" stop-color="#FFF" stop-opacity=".13"/><stop offset="65%" stop-color="#FFF" stop-opacity="0"/><stop offset="100%" stop-color="#623B21" stop-opacity=".045"/></linearGradient>
</defs>
<g id="layer_01_soft_contact_shadow"><rect x="3" y="5" width="314" height="352" rx="29" fill="#593721" opacity=".11"/></g>
<g id="layer_02_paper_base"><rect x="3" y="3" width="314" height="354" rx="29" fill="url(#modal_paper)" stroke="#78513A" stroke-width="2.8"/></g>
<g id="layer_03_soft_surface_highlight"><rect x="5" y="5" width="310" height="350" rx="26" fill="url(#modal_shine)" opacity=".35"/></g>
<g id="layer_04_inside_bevel"><rect x="7" y="7" width="306" height="346" rx="25" fill="none" stroke="#FFFDF6" stroke-width="2" opacity=".84"/></g>
<g id="layer_05_fine_trim"><rect x="10" y="10" width="300" height="340" rx="22" fill="none" stroke="#C1966F" stroke-width="1.1" opacity=".43"/></g>
<g id="layer_06_fixed_corner_accents"><circle cx="24" cy="24" r="2.25" fill="#C1966F" opacity=".65"/><circle cx="296" cy="24" r="2.25" fill="#C1966F" opacity=".65"/><circle cx="24" cy="336" r="2.25" fill="#C1966F" opacity=".65"/><circle cx="296" cy="336" r="2.25" fill="#C1966F" opacity=".65"/></g>
</svg>