<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 140 140" version="1.1" role="img">
<title>下一份预告框 / ui_panel_next</title><desc>独立可编辑矢量母版，2x逻辑源尺寸 280x280; 运行PNG 140x140; 九切 24,24,24,24 像素。所有运行时标题、分数、头像、数字由程序绘制。色彩空间 sRGB。</desc>
<defs>
<linearGradient id="next_paper" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
<stop offset="0%" stop-color="#FFF8EC"/><stop offset="49%" stop-color="#F2E0C8"/><stop offset="100%" stop-color="#E6C6A4"/></linearGradient>
<linearGradient id="next_shine" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#FFF" stop-opacity=".54"/><stop offset="18%" stop-color="#FFF" stop-opacity=".13"/><stop offset="65%" stop-color="#FFF" stop-opacity="0"/><stop offset="100%" stop-color="#623B21" stop-opacity=".045"/></linearGradient>
</defs>
<g id="layer_01_soft_contact_shadow"><rect x="3" y="5" width="134" height="132" rx="21" fill="#593721" opacity=".11"/></g>
