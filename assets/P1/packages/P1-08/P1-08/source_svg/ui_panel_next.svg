<g id="layer_06_fixed_corner_accents"><circle cx="16" cy="16" r="1.8" fill="#D0A37C" opacity=".65"/><circle cx="124" cy="16" r="1.8" fill="#D0A37C" opacity=".65"/><circle cx="16" cy="124" r="1.8" fill="#D0A37C" opacity=".65"/><circle cx="124" cy="124" r="1.8" fill="#D0A37C" opacity=".65"/></g>
