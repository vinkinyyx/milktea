<circle cx="256" cy="256" r="119" stroke="#FFE5B8" stroke-width="13" opacity=".105"/>
<circle cx="256" cy="256" r="112" stroke="#FFF3DA" stroke-width="14" opacity=".33"/>
<circle cx="256" cy="256" r="110" stroke="#FFF9EA" stroke-width="7" opacity=".86"/>
