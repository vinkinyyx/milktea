<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>奶茶挤挤 复活本地联调</title>
<style>html,body{margin:0;background:#111;color:#eee;font:14px/1.5 sans-serif}#status{padding:8px 12px}
#frame{width:750px;height:1334px;transform:scale(.56);transform-origin:top left;border:0}</style></head>
<body>
<div id="status">等待游戏加载…</div>
<iframe id="frame" src="/index.html?rewardedMock=ok&p1bProbe=off"></iframe>
<script>
const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
const frame=document.getElementById('frame'),status=document.getElementById('status');
window.addEventListener('error',e=>{status.textContent='HARNESS ERROR: '+e.message;});
async function waitFor(predicate,timeout=15000){const start=Date.now();while(Date.now()-start<timeout){const value=predicate();if(value)return value;await sleep(400);}return null;}
async function boot(){
  try{
    const w=frame.contentWindow;
    const ready=await waitFor(()=>w&&w.__P1B_FIXTURES__&&w.__P1B_DIAGNOSTICS__,20000);
    if(!ready)throw new Error('game-readiness timeout');
    await sleep(600);
    await w.__P1B_FIXTURES__.start({attemptId:'revive-ui',seed:1,fixtureId:'revive-candidate'});
    status.textContent='fixture revive-candidate 已启动。请点击“跳过并开始”，随后应出现“小料洒出来了”复活弹窗。';
    const pending=await waitFor(()=>{const s=w.__P1B_DIAGNOSTICS__.snapshot();return s&&s.revive&&s.revive.pendingFailure;},90000);
    status.textContent=pending?'复活弹窗已就绪（rewardedMock=ok）。请依次点击“观看广告复活”→“继续游戏”。':'HARNESS FAIL: 等待复活弹窗超时';
    const revived=await waitFor(()=>{const s=w.__P1B_DIAGNOSTICS__.snapshot();return s&&s.revive&&s.revive.used===1;},90000);
    if(revived)status.textContent='复活已生效（reviveUses=1）。请点击“继续游戏”回到本局。';
  }catch(error){status.textContent='HARNESS FAIL: '+error.message;console.error(error);}
}
frame.addEventListener('load',boot);
</script>
</body></html>
